<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>درحال به‌روزرسانی</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .content {
            background: white;
            border-radius: 20px;
            padding: 60px 30px;
            margin-bottom: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 28px;
            color: #1a1a1a;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .subtitle {
            font-size: 15px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .timer {
            background: #f5f5f5;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #333;
        }

        .timer strong {
            color: #667eea;
            font-size: 18px;
        }

        .status {
            display: inline-block;
            background: #e8f5e9;
            color: #2e7d32;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        /* Chat Box Styles */
        .chat-container {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 380px;
            max-height: 600px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            z-index: 999;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px;
            border-radius: 16px 16px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h3 {
            font-size: 15px;
            font-weight: 600;
        }

        .close-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 20px;
            line-height: 1;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            display: flex;
            gap: 8px;
            animation: slideIn 0.3s ease;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-text {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
        }

        .message.bot .message-text {
            background: #f0f0f0;
            color: #333;
            border-radius: 12px 12px 12px 2px;
        }

        .message.user .message-text {
            background: #667eea;
            color: white;
            border-radius: 12px 12px 2px 12px;
        }

        .input-section {
            padding: 12px;
            border-top: 1px solid #f0f0f0;
            display: flex;
            gap: 8px;
        }

        .input-section input {
            flex: 1;
            border: 1px solid #e0e0e0;
            border-radius: 20px;
            padding: 10px 16px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-section input:focus {
            border-color: #667eea;
        }

        .send-btn {
            background: #667eea;
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            font-size: 18px;
        }

        .send-btn:hover {
            background: #5568d3;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .chat-container {
                width: calc(100% - 20px);
                left: 10px;
                right: 10px;
                bottom: 20px;
                max-height: 400px;
            }

            .content {
                padding: 40px 20px;
            }

            h1 {
                font-size: 24px;
            }
        }

        .typing {
            display: flex;
            gap: 4px;
            padding: 10px 14px;
        }

        .typing span {
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                opacity: 0.3;
            }
            30% {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content">
            <div class="icon">⚙️</div>
            <h1>درحال بهبود</h1>
            <p class="subtitle">
                سایت برای ارائه خدمات بهتر تحت به‌روزرسانی است.
                <br>
                در کمی لحظه برای شما بازخواهد آمد.
            </p>
            
            <div class="status">✓ تیم ما درحال کار است</div>
            
            <div class="timer">
                زمان تقریبی: <strong id="timer">۲۰ دقیقه</strong>
            </div>
        </div>
    </div>

    <!-- Chat Box -->
    <div class="chat-container">
        <div class="chat-header">
            <h3>💬 پشتیبان هوشمند</h3>
            <button class="close-btn" onclick="toggleChat()">×</button>
        </div>
        
        <div class="messages" id="messages">
            <div class="message bot">
                <div class="message-text">
                    سلام! 👋 چطور می‌تونم کمکتون کنم؟
                </div>
            </div>
        </div>

        <div class="input-section">
            <input 
                type="text" 
                id="messageInput" 
                placeholder="پیامتان را تایپ کنید..."
                onkeypress="handleKeyPress(event)"
            >
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        const messagesDiv = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');

        function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            // Add user message
            addMessage(message, 'user');
            messageInput.value = '';

            // Show typing indicator
            showTyping();

            // Simulate AI response
            setTimeout(() => {
                removeTyping();
                const response = getAIResponse(message);
                addMessage(response, 'bot');
            }, 1000 + Math.random() * 1000);
        }

        function addMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.innerHTML = `<div class="message-text">${escapeHtml(text)}</div>`;
            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function showTyping() {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message bot';
            msgDiv.id = 'typing';
            msgDiv.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function removeTyping() {
            const typing = document.getElementById('typing');
            if (typing) typing.remove();
        }

        function getAIResponse(message) {
            const responses = [
                '🎯 سوال خوبی! ما به‌زودی سایت را راه‌اندازی می‌کنیم.',
                '✅ از بازگشایی سایت باخبر می‌شوید. لطفاً منتظر بمانید.',
                '🚀 تمام سیستم‌ها به‌روزرسانی می‌شوند. به‌زودی بازخواهد آمد!',
                '💡 اگر سوال دارید، من اینجا هستم تا کمک کنم.',
                '⏳ تقریباً ۲۰ دقیقه دیگر، سایت آماده خواهد بود.',
                '🔄 فعلاً سایت درحال تعمیر است. صبور باشید!',
            ];
            return responses[Math.floor(Math.random() * responses.length)];
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        function toggleChat() {
            const chat = document.querySelector('.chat-container');
            chat.style.display = chat.style.display === 'none' ? 'flex' : 'none';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Update timer
        setInterval(() => {
            const timer = document.getElementById('timer');
            const minutes = Math.floor(Math.random() * 30) + 10;
            timer.textContent = `${minutes} دقیقه`;
        }, 5000);

        // Auto greeting message
        setTimeout(() => {
            addMessage('برای سوال بیشتر، سؤالتان را بپرسید! 😊', 'bot');
        }, 3000);
    </script>
</body>
</html>
